        <li><div class="textSlide" data-text="Space is what is made of it in the moment. The people who move through »Heiligengeistfeld« are as diverse as the ways it is used.On some days, it feels like a vast concrete desert, with only distant city sounds, rustling trees, and a drifting plastic bag. On others, when events like the Hamburger Dom or Schlagermove take place, the field transforms completely. As the city slowly returned to outdoor life after the pandemic, the field filled with spontaneous encounters: people sitting in the sun, skaters navigating the open space, and later, improvised night raves. The continuous reinvention of the place fascinated me. I docu- mented these transformations to show how the Heiligengeistfeld is shaped not by architecture, but by movement, bodies, rituals, and spontaneous use. Its emptiness, scale, and openness makes it a living space, constantly redefined by those who inhabit it. The field becomes a stage, a playground, a temporary village, and a laboratory for public life in Hamburg. My work highlights how people engage with, reinterpret, and give meaning to this urban space.">Info</div>
