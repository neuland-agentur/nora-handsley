        <li><div class="textSlide" data-text="»Good luck around every turn« is a project about empowerment and self-determination. It captures fragments of my life and how agency and humour persist despite uncertainty and difficulty. For the past three years, I’ve been documenting the world as I experienced it. I stumbled through life and laughed about it anyway. Either not thinking at all or far too much. The days blurred. A strange dizziness set in, a sense that something wasn’t quite right. Eventually I found out it was caused by a malignant tumour right in the middle of my head. That year became one of many goodbyes, like driving down a road you’ve travelled for years only to realise you’re leaving it behind.
This work becomes my way of holding on, not to control, but to stay present, to show myself that I can still choose how to look at the world. I don’t want to be just a patient or a diagnosis. I want to decide how I move through this, like showing up to radiotherapy in a kangaroo costume just because it makes me laugh. Making these images helped me stay stubborn, ironic, alive.
Good Luck Around Every Turn gathers fragments of life as it unfolds: unfiltered, uncertain. It’s about learning to live with what you can’t change and finding small moments of freedom in the midst of it all. An act of self-determination, and a reminder that even in this mess, I can still find room for humour and tenderness.">Info</div>
</li>
