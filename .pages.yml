media: media
content:
  - name: legal
    label: "Legal Page"
    type: file
    path: content/legal/index.md
    fields: [
      { name: "title", type: "string", required: "true", readonly: "true" },
      { name: "layout", type: "string", required: "true", hidden: "true", readonly: "true" },
      { name: "body", type: "rich-text", required: "true" }
    ]
    filename: "{index}.md"
    
  - name: about
    label: "About Page"
    type: file
    path: content/about/cv.md
    fields: [
      { name: "CV", type: "string", required: "true", readonly: "true" },
      { name: "body", type: "rich-text", required: "true"}
    ]
  - name: about
    label: "About Page"
    type: file
    path: content/about/exhibitions.md
    fields: [
      { name: "Exhibitions", type: "string", required: "true", readonly: "true" },
      { name: "body", type: "rich-text", required: "true"}
    ]
  - name: about
    label: "About Page"
    type: file
    path: content/about/awards.md
    fields: [
      { name: "Awards", type: "string", required: "true", readonly: "true" },
      { name: "body", type: "rich-text", required: "true"}
    ]
  - name: about
    label: "About Page"
    type: file
    path: content/about/print.md
    fields: [
      { name: "Publications", type: "string", required: "true", readonly: "true" },
      { name: "body", type: "rich-text", required: "true"}
    ]
