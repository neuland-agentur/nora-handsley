media: media
content:
  - name: legal
    label: "Legal Page"
    type: file
    path: content/legal/index.md
    fields: 
      - name: title 
        type: string 
        required: true 
        readonly: true
      - name: layout
        type: string 
        required: true 
        hidden: true 
        readonly: true
      - name: body
        type: rich-text
        required: true

  - name: about-cv
    label: "About – CV"
    type: file
    path: content/about/cv.md
    fields:
      - name: title
        label: "Titel"
        type: string
        default: "CV"
        readonly: true
      - name: body
        label: "Inhalt"
        type: rich-text
        required: true

  - name: about-exhibitions
    label: "About – Exhibitions"
    type: file
    path: content/about/exhibitions.md
    fields:
      - name: title
        label: "Titel"
        type: string
        default: "Exhibitions"
        readonly: true
      - name: items
        label: "Inhalt"
        type: object
        list: true
        fields:
        - name: year
          label: "Jahr"
          type: string
        - name: venue
          label:"Venue"
          type: string


  - name: about-awards
    label: "About – Awards"
    type: file
    path: content/about/awards.md
    fields:
      - name: title
        label: "Titel"
        type: string
        default: "Awards"
        readonly: true
      - name: items
        label: "Inhalt"
        type: object
        list: true
        fields:
        - name: year
          label: "Jahr"
          type: string
        - name: name
          label:"Name"
          type: string

  - name: about-print
    label: "About – Publications"
    type: file
    path: content/about/print.md
    fields:
      - name: title
        label: "Titel"
        type: string
        default: "Publications"
        readonly: true
      - name: items
        label: "Inhalt"
        type: object
        list: true
        fields:
        - name: year
          label: "Jahr"
          type: string
        - name: publication
          label:"Magazin"
          type: string

