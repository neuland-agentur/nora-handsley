<html>
    <head>
        {{ partial "head.html" . }}
        <link rel="stylesheet" href="/css/projects.css">
    </head>
    <body>
        
        {{ partial "navigation.html" . }}
        <main id="main">
            <ol>
                {{range .Pages}}
                <li>
                    <div class="leftNote">{{.Title}}</div>
                    <div class="rightNote">{{.Params.Year}}</div>
                    <div class="images">
                        <a href="{{.Permalink}}">
                           {{.Content}}
                        </a>
                    </div>
                </li>
                {{end}}
            </ol>
        </maind>
        {{ partial "footer.html" . }}
        <script src="/js/projects.js"></script>
    </body>
</html>
